name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  phase-1-0a-remediation:
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
      NX_NO_CLOUD: 'true'
      NX_SKIP_NX_CACHE: 'true'
      NX_TUI: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
