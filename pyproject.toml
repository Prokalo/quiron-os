[project]
name = "quiron"
version = "0.1.0"
description = "Quiron monorepo root"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [ ]

[tool.poetry]
package-mode = false

  [tool.poetry.dependencies]
  python = ">=3.14,<3.15"

    [tool.poetry.dependencies.api]
    path = "apps/api"
    develop = true

[tool.poetry.group.dev.dependencies]
flake8 = "7.1.1"
autopep8 = "2.3.1"
pytest = "8.3.4"
pytest-sugar = "1.0.0"
pytest-cov = "6.0.0"
pytest-html = "4.1.1"
